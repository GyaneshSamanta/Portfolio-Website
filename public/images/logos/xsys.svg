<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- XSYS — The Systems Association of XIMB
       Reconstructed from the user-supplied logo for use on the portfolio
       journey card. Black background, green dotted X mark, "SYS" wordmark,
       and the full caption underneath. -->
  <rect width="640" height="640" fill="#000"/>

  <!-- Green dots forming the X shape -->
  <g fill="#4ADE43">
    <!-- Top-left of the X, larger anchor -->
    <circle cx="120" cy="220" r="34"/>
    <!-- Middle stack (upper) -->
    <circle cx="170" cy="260" r="20"/>
    <circle cx="200" cy="290" r="13"/>
    <!-- Center -->
    <circle cx="225" cy="320" r="9"/>
    <!-- Middle stack (lower) -->
    <circle cx="200" cy="355" r="13"/>
    <circle cx="170" cy="380" r="20"/>
    <!-- Bottom-left, larger anchor -->
    <circle cx="120" cy="420" r="34"/>
  </g>

  <!-- "SYS" wordmark in light grey, custom techy stroke (no font dep) -->
  <g fill="#D9D9D9" font-family="'Geist Mono','SF Mono','Consolas',monospace" font-weight="700" font-size="120" letter-spacing="6">
    <text x="270" y="365">SYS</text>
  </g>

  <!-- Caption — "The Systems Association of XIMB" in white serif -->
  <g fill="#FFFFFF" font-family="'Instrument Serif','Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="34" text-anchor="middle">
    <text x="380" y="465">The Systems Association of</text>
    <text x="380" y="505">XIMB</text>
  </g>
</svg>
