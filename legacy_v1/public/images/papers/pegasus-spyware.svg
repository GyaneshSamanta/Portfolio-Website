    <text x="80" y="32" font-family="'Geist Mono', monospace" font-size="14" fill="#C9BCC4" letter-spacing="1.5">ICECAA</text>
  </g>

  <!-- Decorative bottom-right line -->
  <line x1="1000" y1="599" x2="1140" y2="599" stroke="#ED2EBA" stroke-width="2"/>
  <text x="1140" y="615" text-anchor="end" font-family="'Geist Mono', monospace" font-size="14" fill="#828397" letter-spacing="3">GYANESH.S</text>
