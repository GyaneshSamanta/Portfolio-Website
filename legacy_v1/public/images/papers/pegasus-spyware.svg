<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0820"/>
      <stop offset="100%" stop-color="#1A1A3A"/>
    </linearGradient>
    <radialGradient id="accent" cx="80%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ED2EBA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ED2EBA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent2" cx="10%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#ED2EBA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ED2EBA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#accent)"/>
  <rect width="100%" height="100%" fill="url(#accent2)"/>

  <!-- Eyebrow -->
  <text x="60" y="90" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" letter-spacing="6" fill="#C9BCC4">RESEARCH · 2023</text>

  <!-- Title -->
  <text x="60" y="270" font-family="'Instrument Serif', 'Iowan Old Style', serif" font-style="italic" font-size="68" fill="#F5EFEF">Pegasus Spyware: An Attack</text>
  <text x="60" y="354" font-family="'Instrument Serif', 'Iowan Old Style', serif" font-style="italic" font-size="68" fill="#F5EFEF">System Artemis</text>

  <!-- IEEE badge -->
  <g transform="translate(60, 575)">
    <rect width="180" height="48" rx="24" fill="#ED2EBA" fill-opacity="0.15" stroke="#ED2EBA" stroke-width="1.5"/>
    <text x="22" y="32" font-family="'Geist Mono', monospace" font-size="20" font-weight="700" fill="#F5EFEF" letter-spacing="2">IEEE</text>
